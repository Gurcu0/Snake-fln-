<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oyun Portalı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none; /* Telefonda butonlara basarken metin seçilmesini önler */
      -webkit-user-select: none;
    }

    /* GİRİŞ EKRANI */
    #auth-container {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }

    #auth-container h2 {
      margin-bottom: 1.5rem;
      color: #38bdf8;
    }

    .input-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background: #0369a1;
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .btn-small {
      width: auto;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      background: #334155;
    }

    .btn-small:hover {
      background: #475569;
    }

    /* EN SAĞ ÜST AYARLAR ÇARKI */
    #settings-cog {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 100;
      display: none;
    }

    /* AYARLAR PENCERESİ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #1e293b;
      padding: 1.8rem;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      color: #38bdf8;
      margin-bottom: 1.2rem;
    }

    /* OYUN SEÇİM MENÜSÜ */
    #games-menu-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    #games-menu-container h2 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 5px;
    }

    #games-menu-container p.subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .game-card .icon-box {
      width: 100%;
      height: 120px;
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .game-card.disabled {
      opacity: 0.5;
      filter: grayscale(0.8);
      pointer-events: none;
    }

    /* OYUN EKRANI VE BOYUTLAR */
    #game-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 100vh;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 600px; /* PC Varsayılan Genişliği */
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .scores {
      font-size: 1.05rem;
    }

    .scores span {
      color: #38bdf8;
      font-weight: bold;
    }

    .game-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      position: relative;
    }

    /* PC BOYUTU: 600x600 */
    canvas {
      background-color: #020617;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      width: 600px;
      height: 600px;
    }

    .leaderboard {
      position: absolute;
      top: 0;
      left: 620px;
      width: 240px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .leaderboard h3 {
      font-size: 1.05rem;
      color: #fbbf24;
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .leaderboard ol {
      list-style-position: inside;
      padding: 0;
      margin: 0;
    }

    .leaderboard li {
      font-size: 0.9rem;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }

    .leaderboard li span.score-val {
      color: #38bdf8;
      font-weight: bold;
    }

    .controls-info {
      color: #94a3b8;
      font-size: 0.95rem;
      text-align: center;
    }

    /* DOKUNMATİK TELEFON BUTONLARI (PC'DE GİZLİ) */
    #touch-controls {
      display: none; /* Bilgisayarda varsayılan olarak kapalı */
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      touch-action: manipulation;
    }

    .dpad-row {
      display: flex;
      gap: 15px;
    }

    .dpad-btn {
      width: 65px;
      height: 65px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.1s, transform 0.1s;
    }

    .dpad-btn:active {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(0.92);
    }

    /* --- TELEFON / MOBİL EKRANLAR İÇİN DÜZENLEME (768px altı) --- */
    @media (max-width: 768px) {
      .top-bar {
        width: 100%;
        max-width: 400px;
      }

      .game-layout {
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      /* MOBİL BOYUTU: TELEFONDA 400x400 OLUR */
      canvas {
        width: 100%;
        max-width: 400px;
        height: auto;
        aspect-ratio: 1 / 1;
      }

      .leaderboard {
        position: relative;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 400px;
        margin-top: 5px;
      }

      /* TELEFONDA DOKUNMATİK BUTONLARI AÇ */
      #touch-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- SAĞ ÜST AYARLAR ÇARKI -->
  <div id="settings-cog" onclick="openSettings()">⚙️</div>

  <!-- AYARLAR PENCERESİ -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>Ayar Menüsü</h3>
      <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #94a3b8;">
        Aktif Oyuncu: <b id="modal-player-name" style="color:#fff;">-</b>
      </p>
      <button class="btn btn-danger" onclick="logoutUser()">Hesap Değiştir / Çıkış Yap</button>
      <button class="btn" style="background:#475569; margin-top: 8px;" onclick="closeSettings()">Kapat</button>
    </div>
  </div>

  <!-- 1. GİRİŞ EKRANI -->
  <div id="auth-container">
    <h2>Oyun Portalı</h2>
    <form id="auth-form" onsubmit="loginUser(event)">
      <div class="input-group">
        <label for="username">Oyuncu Adı</label>
        <input type="text" id="username" placeholder="Oyuncu adınızı girin" required>
      </div>
      <div class="input-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" placeholder="Şifrenizi girin" required>
      </div>
      <button type="submit" class="btn">Kayıt Ol / Giriş Yap</button>
    </form>
  </div>

  <!-- 2. OYUN SEÇİM MENÜSÜ -->
  <div id="games-menu-container">
    <h2>Oyun Kütüphanesi</h2>
    <p class="subtitle">Oynamak istediğin oyuna tıkla!</p>

    <div class="games-grid">
      <div class="game-card">
        <div class="icon-box">🐍</div>
        <h4>Yılan Oyunu</h4>
        <button class="btn" onclick="startSnakeGame()">Oyna</button>
      </div>

      <div class="game-card disabled">
        <div class="icon-box">🧱</div>
        <h4>Brick Breaker</h4>
        <button class="btn" style="background:#475569;">Yakında</button>
      </div>

      <div class="game-card disabled">
        <div class="icon-box">🚗</div>
        <h4>Araba Yarışı</h4>
        <button class="btn" style="background:#475569;">Yakında</button>
      </div>
    </div>
  </div>

  <!-- 3. YILAN OYUNU EKRANI -->
  <div id="game-container">
    <div class="top-bar">
      <button class="btn btn-small" onclick="backToMenu()">⬅️ Menü</button>
      <div class="scores">
        Oyuncu: <span id="player-display">-</span> | 
        Skor: <span id="score">0</span>
      </div>
      <button class="btn btn-small" onclick="toggleFullScreen()">Tam Ekran</button>
    </div>

    <div class="game-layout">
      <canvas id="gameCanvas" width="600" height="600"></canvas>

      <div class="leaderboard">
        <h3>🏆 Top 5 Rekor</h3>
        <ol id="leaderboard-list">
          <li><span>-</span><span class="score-val">0</span></li>
        </ol>
      </div>
    </div>
    
    <div class="controls-info" id="status-text">Oynamak için yön tuşlarını veya aşağıdaki okları kullanın!</div>

    <!-- TELEFON SANAL YÖN BUTONLARI (D-PAD) -->
    <div id="touch-controls">
      <button class="dpad-btn" onclick="handleDirection('UP')">⬆️</button>
      <div class="dpad-row">
        <button class="dpad-btn" onclick="handleDirection('LEFT')">⬅️</button>
        <button class="dpad-btn" onclick="handleDirection('RIGHT')">➡️</button>
      </div>
      <button class="dpad-btn" onclick="handleDirection('DOWN')">⬇️</button>
    </div>
  </div>

  <script>
    let currentUser = "";

    function loginUser(e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (user && pass) {
        currentUser = user;
        document.getElementById("player-display").innerText = currentUser;
        document.getElementById("modal-player-name").innerText = currentUser;
        
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("games-menu-container").style.display = "flex";
        document.getElementById("settings-cog").style.display = "block";
      }
    }

    function startSnakeGame() {
      document.getElementById("games-menu-container").style.display = "none";
      document.getElementById("game-container").style.display = "flex";
      
      updateLeaderboardDisplay();
      initGame();
    }

    function backToMenu() {
      if (gameInterval) clearInterval(gameInterval);
      gameStarted = false;
      document.getElementById("game-container").style.display = "none";
      document.getElementById("games-menu-container").style.display = "flex";
    }

    function openSettings() {
      document.getElementById("settings-modal").style.display = "flex";
      if (gameStarted) {
        gameStarted = false;
        document.getElementById("status-text").innerText = "Oyun Duraklatıldı.";
      }
    }

    function closeSettings() {
      document.getElementById("settings-modal").style.display = "none";
    }

    function logoutUser() {
      closeSettings();
      if (gameInterval) clearInterval(gameInterval);
      
      currentUser = "";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      
      document.getElementById("settings-cog").style.display = "none";
      document.getElementById("game-container").style.display = "none";
      document.getElementById("games-menu-container").style.display = "none";
      document.getElementById("auth-container").style.display = "block";
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // OYUN MANTIĞI
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const gridSize = 20; 
    const tileCount = canvas.width / gridSize; 

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameInterval = null;
    let gameStarted = false;

    function getAllScores() {
      const scores = localStorage.getItem("snake_all_scores");
      return scores ? JSON.parse(scores) : {};
    }

    function saveUserScore(newScore) {
      const scores = getAllScores();
      if (!scores[currentUser] || newScore > scores[currentUser]) {
        scores[currentUser] = newScore;
        localStorage.setItem("snake_all_scores", JSON.stringify(scores));
        updateLeaderboardDisplay();
      }
    }

    function updateLeaderboardDisplay() {
      const scores = getAllScores();
      let sortedList = Object.keys(scores).map(user => {
        return { name: user, score: scores[user] };
      });

      sortedList.sort((a, b) => b.score - a.score);
      const top5 = sortedList.slice(0, 5);

      const leaderboardEl = document.getElementById("leaderboard-list");
      leaderboardEl.innerHTML = "";

      if (top5.length === 0) {
        leaderboardEl.innerHTML = "<li><span>Henüz rekor yok</span><span class='score-val'>0</span></li>";
        return;
      }

      top5.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${index + 1}. ${item.name}</span><span class="score-val">${item.score}</span>`;
        leaderboardEl.appendChild(li);
      });
    }

    function initGame() {
      if (gameInterval) clearInterval(gameInterval);
      
      snake = [{ x: 15, y: 15 }, { x: 15, y: 16 }, { x: 15, y: 17 }];
      dx = 0;
      dy = -1;
      score = 0;
      gameStarted = false;
      
      document.getElementById("score").innerText = score;
      document.getElementById("status-text").innerText = "Başlamak için Yön Tuşlarına veya Ok Butonlarına basın!";
      
      generateFood();
      draw();
      
      gameInterval = setInterval(gameLoop, 100);
    }

    function gameLoop() {
      if (gameStarted) {
        update();
      }
      draw();
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById("score").innerText = score;
        saveUserScore(score);
        generateFood();
      } else {
        snake.pop();
      }
    }

    function drawRoundedRect(x, y, width, height, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const foodX = food.x * gridSize + gridSize / 2;
      const foodY = food.y * gridSize + gridSize / 2;
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(foodX, foodY, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((segment, index) => {
        const x = segment.x * gridSize + 1;
        const y = segment.y * gridSize + 1;
        const size = gridSize - 2;

        if (index === 0) {
          drawRoundedRect(x, y, size, size, 8, "#4ade80");

          ctx.fillStyle = "#020617";
          let eyeSize = 3;
          let eyeOffset1 = { x: 4, y: 4 };
          let eyeOffset2 = { x: 12, y: 4 };

          if (dx === 1) {
            eyeOffset1 = { x: 12, y: 4 }; eyeOffset2 = { x: 12, y: 12 };
          } else if (dx === -1) {
            eyeOffset1 = { x: 4, y: 4 }; eyeOffset2 = { x: 4, y: 12 };
          } else if (dy === 1) {
            eyeOffset1 = { x: 4, y: 12 }; eyeOffset2 = { x: 12, y: 12 };
          }

          ctx.beginPath();
          ctx.arc(x + eyeOffset1.x, y + eyeOffset1.y, eyeSize, 0, Math.PI * 2);
          ctx.arc(x + eyeOffset2.x, y + eyeOffset2.y, eyeSize, 0, Math.PI * 2);
          ctx.fill();

        } else {
          drawRoundedRect(x, y, size, size, 5, "#22c55e");
        }
      });
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function gameOver() {
      gameStarted = false;
      clearInterval(gameInterval);
      saveUserScore(score);
      alert("Oyun Bitti! Skorunuz: " + score);
      initGame();
    }

    // YÖN DEĞİŞTİRME MANTIĞI (HEM TUŞ HEM BUTON İÇİN)
    function changeDirection(dir) {
      let moved = false;
      if (dir === "UP" && dy !== 1) { dx = 0; dy = -1; moved = true; }
      if (dir === "DOWN" && dy !== -1) { dx = 0; dy = 1; moved = true; }
      if (dir === "LEFT" && dx !== 1) { dx = -1; dy = 0; moved = true; }
      if (dir === "RIGHT" && dx !== -1) { dx = 1; dy = 0; moved = true; }

      if (moved && !gameStarted) {
        gameStarted = true;
        document.getElementById("status-text").innerText = "Oyun Başladı! Başarılar.";
      }
    }

    // TELEFON DOKUNMATİK BUTON TIKLAMASI
    function handleDirection(dir) {
      changeDirection(dir);
    }

    // KLAVYEDEN TUŞ BASILMASI
    window.addEventListener("keydown", e => {
      if (document.activeElement.tagName === "INPUT") return;
      if (document.getElementById("game-container").style.display !== "flex") return;

      switch (e.key) {
        case "ArrowUp": case "w": case "W": changeDirection("UP"); break;
        case "ArrowDown": case "s": case "S": changeDirection("DOWN"); break;
        case "ArrowLeft": case "a": case "A": changeDirection("LEFT"); break;
        case "ArrowRight": case "d": case "D": changeDirection("RIGHT"); break;
      }
    });
  </script>
</body>
</html>
