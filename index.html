<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oyun Portalı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* GİRİŞ EKRANI */
    #auth-container {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }

    #auth-container h2 {
      margin-bottom: 1.5rem;
      color: #38bdf8;
    }

    .input-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background: #0369a1;
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .btn-small {
      width: auto;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      background: #334155;
    }

    .btn-small:hover {
      background: #475569;
    }

    /* AYARLAR ÇARKI */
    #settings-cog {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 100;
      display: none;
    }

    /* AYARLAR PENCERESİ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #1e293b;
      padding: 1.8rem;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      color: #38bdf8;
      margin-bottom: 1.2rem;
    }

    /* OYUN SEÇİM MENÜSÜ */
    #games-menu-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    #games-menu-container h2 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 5px;
    }

    #games-menu-container p.subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .game-card .icon-box {
      width: 100%;
      height: 120px;
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 12px;
    }

    /* OYUN EKRANI */
    #game-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 100vh;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 600px;
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .scores {
      font-size: 1.05rem;
    }

    .scores span {
      color: #38bdf8;
      font-weight: bold;
    }

    .game-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      position: relative;
    }

    canvas {
      background-color: #020617;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      width: 600px;
      height: 600px;
    }

    .leaderboard {
      position: absolute;
      top: 0;
      left: 620px;
      width: 240px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .leaderboard h3 {
      font-size: 1.05rem;
      color: #fbbf24;
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .leaderboard ol {
      list-style-position: inside;
      padding: 0;
      margin: 0;
    }

    .leaderboard li {
      font-size: 0.9rem;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }

    .leaderboard li span.score-val {
      color: #38bdf8;
      font-weight: bold;
    }

    .controls-info {
      color: #94a3b8;
      font-size: 0.95rem;
      text-align: center;
    }

    /* TELEFON DOKUNMATİK D-PAD */
    #touch-controls {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      touch-action: manipulation;
    }

    .dpad-row {
      display: flex;
      gap: 15px;
    }

    .dpad-btn {
      width: 60px;
      height: 60px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.1s, transform 0.1s;
    }

    .dpad-btn:active {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(0.92);
    }

    /* MOBİL PORTRAIT */
    @media (max-width: 768px) and (orientation: portrait) {
      .top-bar {
        width: 100%;
        max-width: 400px;
      }

      .game-layout {
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      canvas {
        width: 100%;
        max-width: 400px;
        height: auto;
        aspect-ratio: 1 / 1;
      }

      .leaderboard {
        position: relative;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 400px;
        margin-top: 5px;
      }

      #touch-controls {
        display: flex;
      }
    }

    /* MOBİL LANDSCAPE (KONSOL MODU) */
    @media (max-width: 900px) and (orientation: landscape) {
      #game-container {
        padding: 5px;
        justify-content: flex-start;
      }

      .top-bar {
        width: 95vw;
        padding: 6px 15px;
        margin-bottom: 5px;
      }

      .game-layout {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 25px;
        width: 95vw;
      }

      #touch-controls {
        display: flex;
        margin-top: 0;
        order: 1;
      }

      .dpad-btn {
        width: 50px;
        height: 50px;
        font-size: 1.3rem;
      }

      canvas {
        order: 2;
        height: 75vh;
        width: 75vh;
        max-width: none;
      }

      .leaderboard {
        order: 3;
        position: relative;
        left: 0;
        top: 0;
        width: 180px;
        padding: 8px;
        font-size: 0.8rem;
      }

      .leaderboard h3 {
        font-size: 0.9rem;
        margin-bottom: 6px;
      }

      .leaderboard li {
        padding: 4px 6px;
        font-size: 0.75rem;
      }

      .controls-info {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- AYARLAR ÇARKI -->
  <div id="settings-cog" onclick="openSettings()">⚙️</div>

  <!-- AYARLAR PENCERESİ -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>Ayar Menüsü</h3>
      <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #94a3b8;">
        Aktif Oyuncu: <b id="modal-player-name" style="color:#fff;">-</b>
      </p>
      <button class="btn btn-danger" onclick="logoutUser()">Hesap Değiştir / Çıkış Yap</button>
      <button class="btn" style="background:#475569; margin-top: 8px;" onclick="closeSettings()">Kapat</button>
    </div>
  </div>

  <!-- 1. GİRİŞ EKRANI -->
  <div id="auth-container">
    <h2>Oyun Portalı</h2>
    <form id="auth-form" onsubmit="loginUser(event)">
      <div class="input-group">
        <label for="username">Oyuncu Adı</label>
        <input type="text" id="username" placeholder="Oyuncu adınızı girin" required>
      </div>
      <div class="input-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" placeholder="Şifrenizi girin" required>
      </div>
      <button type="submit" class="btn">Kayıt Ol / Giriş Yap</button>
    </form>
  </div>

  <!-- 2. OYUN SEÇİM MENÜSÜ -->
  <div id="games-menu-container">
    <h2>Oyun Kütüphanesi</h2>
    <p class="subtitle">Oynamak istediğin oyuna tıkla!</p>

    <div class="games-grid">
      <div class="game-card">
        <div class="icon-box">🐍</div>
        <h4>Yılan Oyunu</h4>
        <button class="btn" onclick="startSelectedGame('snake')">Oyna</button>
      </div>

      <div class="game-card">
        <div class="icon-box">🧱</div>
        <h4>Brick Breaker</h4>
        <button class="btn" onclick="startSelectedGame('brick')">Oyna</button>
      </div>

      <div class="game-card">
        <div class="icon-box">🚗</div>
        <h4>Araba Yarışı</h4>
        <button class="btn" onclick="startSelectedGame('car')">Oyna</button>
      </div>
    </div>
  </div>

  <!-- 3. OYUN EKRANI -->
  <div id="game-container">
    <div class="top-bar">
      <button class="btn btn-small" onclick="backToMenu()">⬅️ Menü</button>
      <div class="scores">
        Oyuncu: <span id="player-display">-</span> | 
        Skor: <span id="score">0</span>
      </div>
      <button class="btn btn-small" onclick="toggleFullScreen()">Tam Ekran</button>
    </div>

    <div class="game-layout">
      <div id="touch-controls">
        <button class="dpad-btn" onclick="handleDirection('UP')">⬆️</button>
        <div class="dpad-row">
          <button class="dpad-btn" onclick="handleDirection('LEFT')">⬅️</button>
          <button class="dpad-btn" onclick="handleDirection('RIGHT')">➡️</button>
        </div>
        <button class="dpad-btn" onclick="handleDirection('DOWN')">⬇️</button>
      </div>

      <canvas id="gameCanvas" width="600" height="600"></canvas>

      <div class="leaderboard">
        <h3>🏆 Top 5 Rekor</h3>
        <ol id="leaderboard-list">
          <li><span>-</span><span class="score-val">0</span></li>
        </ol>
      </div>
    </div>
    
    <div class="controls-info" id="status-text">Oynamak için yön tuşlarını veya okları kullanın!</div>
  </div>

  <script>
    let currentUser = "";
    let activeGame = "";
    let gameInterval = null;
    let gameStarted = false;
    let score = 0;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function loginUser(e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (user && pass) {
        currentUser = user;
        document.getElementById("player-display").innerText = currentUser;
        document.getElementById("modal-player-name").innerText = currentUser;
        
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("games-menu-container").style.display = "flex";
        document.getElementById("settings-cog").style.display = "block";
      }
    }

    function openSettings() {
      document.getElementById("settings-modal").style.display = "flex";
      if (gameStarted) {
        gameStarted = false;
        document.getElementById("status-text").innerText = "Oyun Duraklatıldı.";
      }
    }

    function closeSettings() {
      document.getElementById("settings-modal").style.display = "none";
    }

    function logoutUser() {
      closeSettings();
      if (gameInterval) clearInterval(gameInterval);
      
      currentUser = "";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      
      document.getElementById("settings-cog").style.display = "none";
      document.getElementById("game-container").style.display = "none";
      document.getElementById("games-menu-container").style.display = "none";
      document.getElementById("auth-container").style.display = "block";
    }

    function backToMenu() {
      if (gameInterval) clearInterval(gameInterval);
      gameStarted = false;
      document.getElementById("game-container").style.display = "none";
      document.getElementById("games-menu-container").style.display = "flex";
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* LİDERLİK TABLOSU */
    function getAllScores(gameName) {
      const scores = localStorage.getItem(gameName + "_scores");
      return scores ? JSON.parse(scores) : {};
    }

    function saveUserScore(gameName, newScore) {
      if (newScore <= 0) return;
      const scores = getAllScores(gameName);
      if (!scores[currentUser] || newScore > scores[currentUser]) {
        scores[currentUser] = newScore;
        localStorage.setItem(gameName + "_scores", JSON.stringify(scores));
        updateLeaderboardDisplay(gameName);
      }
    }

    function updateLeaderboardDisplay(gameName) {
      const scores = getAllScores(gameName);
      let sortedList = Object.keys(scores).map(user => {
        return { name: user, score: scores[user] };
      });

      sortedList.sort((a, b) => b.score - a.score);
      const top5 = sortedList.slice(0, 5);

      const leaderboardEl = document.getElementById("leaderboard-list");
      leaderboardEl.innerHTML = "";

      if (top5.length === 0) {
        leaderboardEl.innerHTML = "<li><span>Henüz rekor yok</span><span class='score-val'>0</span></li>";
        return;
      }

      top5.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${index + 1}. ${item.name}</span><span class='score-val'>${item.score}</span>`;
        leaderboardEl.appendChild(li);
      });
    }

    function startSelectedGame(gameType) {
      activeGame = gameType;
      document.getElementById("games-menu-container").style.display = "none";
      document.getElementById("game-container").style.display = "flex";
      
      updateLeaderboardDisplay(activeGame);

      if (activeGame === 'snake') initSnake();
      else if (activeGame === 'brick') initBrick();
      else if (activeGame === 'car') initCar();
    }

    /* 1. YILAN OYUNU */
    const gridSize = 20; 
    const tileCount = canvas.width / gridSize; 
    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 0, dy = -1;

    function initSnake() {
      if (gameInterval) clearInterval(gameInterval);
      snake = [{ x: 15, y: 15 }, { x: 15, y: 16 }, { x: 15, y: 17 }];
      dx = 0; dy = -1; score = 0; gameStarted = false;
      document.getElementById("score").innerText = score;
      document.getElementById("status-text").innerText = "Başlamak için Yön Tuşlarına basın!";
      generateSnakeFood();
      drawSnakeGame();
      gameInterval = setInterval(snakeLoop, 100);
    }

    function snakeLoop() {
      if (gameStarted) {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
          endGame("Yılan duvara çarptı!"); return;
        }
        for (let i = 0; i < snake.length; i++) {
          if (head.x === snake[i].x && head.y === snake[i].y) {
            endGame("Yılan kendisine çarptı!"); return;
          }
        }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          document.getElementById("score").innerText = score;
          saveUserScore('snake', score);
          generateSnakeFood();
        } else {
          snake.pop();
        }
      }
      drawSnakeGame();
    }

    function drawSnakeGame() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
    }

    function generateSnakeFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    /* 2. BRICK BREAKER */
    let paddleWidth = 100, paddleHeight = 15, paddleX = 250;
    let ballX = 300, ballY = 500, ballDX = 4, ballDY = -4, ballRadius = 8;
    let bricks = [], brickRows = 5, brickCols = 7, brickWidth = 75, brickHeight = 20, brickPadding = 8, brickOffsetTop = 50, brickOffsetLeft = 12;

    function initBrick() {
      if (gameInterval) clearInterval(gameInterval);
      paddleX = (canvas.width - paddleWidth) / 2;
      ballX = canvas.width / 2; ballY = canvas.height - 40;
      ballDX = 4; ballDY = -4; score = 0; gameStarted = false;
      document.getElementById("score").innerText = score;
      document.getElementById("status-text").innerText = "Başlamak için Sol/Sağ Tuşlarına basın!";

      bricks = [];
      for (let c = 0; c < brickCols; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRows; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
      }
      drawBrickGame();
      gameInterval = setInterval(brickLoop, 1000 / 60);
    }

    function brickLoop() {
      if (gameStarted) {
        ballX += ballDX; ballY += ballDY;

        if (ballX + ballDX > canvas.width - ballRadius || ballX + ballDX < ballRadius) ballDX = -ballDX;
        if (ballY + ballDY < ballRadius) ballDY = -ballDY;
        else if (ballY + ballDY > canvas.height - ballRadius - paddleHeight) {
          if (ballX > paddleX && ballX < paddleX + paddleWidth) {
            ballDY = -ballDY;
          } else if (ballY + ballDY > canvas.height - ballRadius) {
            endGame("Top düştü!"); return;
          }
        }

        for (let c = 0; c < brickCols; c++) {
          for (let r = 0; r < brickRows; r++) {
            let b = bricks[c][r];
            if (b.status === 1) {
              if (ballX > b.x && ballX < b.x + brickWidth && ballY > b.y && ballY < b.y + brickHeight) {
                ballDY = -ballDY; b.status = 0; score += 10;
                document.getElementById("score").innerText = score;
                saveUserScore('brick', score);
              }
            }
          }
        }
      }
      drawBrickGame();
    }

    function drawBrickGame() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let c = 0; c < brickCols; c++) {
        for (let r = 0; r < brickRows; r++) {
          if (bricks[c][r].status === 1) {
            let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
            let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
            bricks[c][r].x = brickX; bricks[c][r].y = brickY;
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
          }
        }
      }

      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    /* 3. ARABA YARIŞI */
    let carX = 270, carY = 480, carWidth = 50, carHeight = 80;
    let obstacles = [], obstacleSpeed = 5, carScore = 0;

    function initCar() {
      if (gameInterval) clearInterval(gameInterval);
      carX = 275; carScore = 0; score = 0; obstacleSpeed = 5; gameStarted = false;
      obstacles = [];
      document.getElementById("score").innerText = score;
      document.getElementById("status-text").innerText = "Başlamak için Sol/Sağ Tuşlarına basın!";
      drawCarGame();
      gameInterval = setInterval(carLoop, 1000 / 60);
    }

    function carLoop() {
      if (gameStarted) {
        carScore++;
        if (carScore % 10 === 0) {
          score = Math.floor(carScore / 10);
          document.getElementById("score").innerText = score;
          saveUserScore('car', score);
        }

        if (carScore % 90 === 0) {
          let obsX = Math.random() * (canvas.width - 60);
          obstacles.push({ x: obsX, y: -80, width: 50, height: 80 });
        }

        for (let i = 0; i < obstacles.length; i++) {
          obstacles[i].y += obstacleSpeed;
          if (
            carX < obstacles[i].x + obstacles[i].width &&
            carX + carWidth > obstacles[i].x &&
            carY < obstacles[i].y + obstacles[i].height &&
            carY + carHeight > obstacles[i].y
          ) {
            endGame("Kaza Yaptın!"); return;
          }
        }
        if (obstacles.length > 0 && obstacles[0].y > canvas.height) obstacles.shift();
      }
      drawCarGame();
    }

    function drawCarGame() {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#ffffff";
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(carX, carY, carWidth, carHeight);

      ctx.fillStyle = "#ef4444";
      obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.width, obs.height));
    }

    /* KONTROLLER */
    function endGame(msg) {
      gameStarted = false;
      clearInterval(gameInterval);
      alert("Oyun Bitti! " + msg + " Skorunuz: " + score);
      startSelectedGame(activeGame);
    }

    function handleDirection(dir) {
      if (!gameStarted) {
        gameStarted = true;
        document.getElementById("status-text").innerText = "Oyun Başladı!";
      }

      if (activeGame === 'snake') {
        if (dir === 'UP' && dy !== 1) { dx = 0; dy = -1; }
        if (dir === 'DOWN' && dy !== -1) { dx = 0; dy = 1; }
        if (dir === 'LEFT' && dx !== 1) { dx = -1; dy = 0; }
        if (dir === 'RIGHT' && dx !== -1) { dx = 1; dy = 0; }
      } else if (activeGame === 'brick') {
        if (dir === 'LEFT' && paddleX > 0) paddleX -= 35;
        if (dir === 'RIGHT' && paddleX < canvas.width - paddleWidth) paddleX += 35;
      } else if (activeGame === 'car') {
        if (dir === 'LEFT' && carX > 10) carX -= 30;
        if (dir === 'RIGHT' && carX < canvas.width - carWidth - 10) carX += 30;
      }
    }

    window.addEventListener("keydown", e => {
      if (document.activeElement.tagName === "INPUT") return;
      if (document.getElementById("game-container").style.display !== "flex") return;

      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") handleDirection('UP');
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") handleDirection('DOWN');
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") handleDirection('LEFT');
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") handleDirection('RIGHT');
    });
  </script>
</body>
</html>
