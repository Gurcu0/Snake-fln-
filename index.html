<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oyun Portalı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* GİRİŞ EKRANI */
    #auth-container {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }

    #auth-container h2 {
      margin-bottom: 1.5rem;
      color: #38bdf8;
    }

    .input-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background: #0369a1;
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .btn-small {
      width: auto;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      background: #334155;
    }

    .btn-small:hover {
      background: #475569;
    }

    /* SAĞ ÜST AYARLAR ÇARKI */
    #settings-cog {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 100;
      display: none;
    }

    /* AYARLAR PENCERESİ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #1e293b;
      padding: 1.8rem;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      color: #38bdf8;
      margin-bottom: 1.2rem;
    }

    /* OYUN SEÇİM MENÜSÜ */
    #games-menu-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    #games-menu-container h2 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 5px;
    }

    #games-menu-container p.subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .game-card .icon-box {
      width: 100%;
      height: 120px;
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 12px;
    }

    /* OYUN EKRANI VE BOYUTLAR */
    #game-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 100vh;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 600px;
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .scores {
      font-size: 1.05rem;
    }

    .scores span {
      color: #38bdf8;
      font-weight: bold;
    }

    .game-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      position: relative;
    }

    canvas {
      background-color: #020617;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      width: 600px;
      height: 600px;
    }

    .leaderboard {
      position: absolute;
      top: 0;
      left: 620px;
      width: 240px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .leaderboard h3 {
      font-size: 1.05rem;
      color: #fbbf24;
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .leaderboard ol {
      list-style-position: inside;
      padding: 0;
      margin: 0;
    }

    .leaderboard li {
      font-size: 0.9rem;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }

    .leaderboard li span.score-val {
      color: #38bdf8;
      font-weight: bold;
    }

    .controls-info {
      color: #94a3b8;
      font-size: 0.95rem;
      text-align: center;
    }

    /* DOKUNMATİK TELEFON BUTONLARI */
    #touch-controls {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      touch-action: manipulation;
    }

    .dpad-row {
      display: flex;
      gap: 15px;
    }

    .dpad-btn {
      width: 60px;
      height: 60px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.1s, transform 0.1s;
    }

    .dpad-btn:active {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(0.92);
    }

    /* TELEFON DİK KONUM (PORTRAIT) */
    @media (max-width: 768px) and (orientation: portrait) {
      .top-bar {
        width: 100%;
        max-width: 400px;
      }

      .game-layout {
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      canvas {
        width: 100%;
        max-width: 400px;
        height: auto;
        aspect-ratio: 1 / 1;
      }

      .leaderboard {
        position: relative;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 400px;
        margin-top: 5px;
      }

      #touch-controls {
        display: flex;
      }
    }

    /* TELEFON YATAY KONUM (LANDSCAPE - EL KONSOLU MODU) */
    @media (max-width: 900px) and (orientation: landscape) {
      #game-container {
        padding: 5px;
        justify-content: flex-start;
      }

      .top-bar {
        width: 95vw;
        padding: 6px 15px;
        margin-bottom: 5px;
      }

      .game-layout {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 25px;
        width: 95vw;
      }

      #touch-controls {
        display: flex;
        margin-top: 0;
        order: 1;
      }

      .dpad-btn {
        width: 50px;
        height: 50px;
        font-size: 1.3rem;
      }

      canvas {
        order: 2;
        height: 75vh;
        width: 75vh;
        max-width: none;
      }

      .leaderboard {
        order: 3;
        position: relative;
        left: 0;
        top: 0;
        width: 180px;
        padding: 8px;
        font-size: 0.8rem;
      }

      .leaderboard h3 {
        font-size: 0.9rem;
        margin-bottom: 6px;
      }

      .leaderboard li {
        padding: 4px 6px;
        font-size: 0.75rem;
      }

      .controls-info {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- SAĞ ÜST AYARLAR ÇARKI -->
  <div id="settings-cog" onclick="openSettings()">⚙️</div>

  <!-- AYARLAR PENCERESİ -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>Ayar Menüsü</h3>
      <Yakında çıkacak (henüz çıkmamış) büyük oyunlar için Visual Studio Code'da HTML, CSS ve JavaScript kullanarak oynanabilir, keyifli 2D mini projeler hazırlayabilirsin. İşte VS Code'da yazabileceğin 3 farklı oyun fikri ve mantığı:

### 1. GTA VI — "Vice City Sürücü & Takip" (2D Top-Down Racing)
* **Konu:** Vice City sokaklarında polisten kaçarken para ve bonus topladığın, engellere takılmamaya çalıştığın kuş bakışı bir sürüş oyunu.
* **Oyun Mantığı:** 
  * `HTML5 Canvas` kullanarak bir yol ve araba çizersin.
  * Sol/sağ ok tuşlarıyla arabayı yönlendirir, yukarıdan aşağıya doğru gelen engellerden (polis arabaları, barikatlar) kaçarsın.
  * Skoru ekranda anlık tutup hızlanan bir yapı kurabilirsin.

### 2. Mafya: The Old Country — "Sicilya Gizlilik & Kaçış" (2D Stealth / Runner)
* **Konu:** 1900'lerin başında Sicilya'da geçen, muhafızların görüş alanından kaçarak hedef noktaya ulaşmaya çalıştığın bir gizlilik (stealth) mini oyunu.
* **Oyun Mantığı:**
  * Karakterini yön tuşlarıyla hareket ettirirsin.
  * Haritada devriye atan muhafızlar (düşmanlar) olur ve önlerinde dönen bir "görüş açısı" (kırmızı koni) bulunur.
  * Muhafızların görüş alanına girmeden siperlerin (kutular, duvarlar) arkasından geçerek finiş noktasına ulaşırsın.

### 3. Marvel 1943: Rise of Hydra — "Siper Saldırısı" (2D Side-Scroller Action)
* **Konu:** 2. Dünya Savaşı döneminde Paris sokaklarında geçen, siper alıp düşman askerlerini etkisiz hale getirdiğin aksiyon oyunu.
* **Oyun Mantığı:**
  * Karakterin ekranın solunda durur.
  * Boşluk (Space) tuşuna basılı tuttuğunda siper alır (hasar almaz), bıraktığında ateş eder.
  * Sağ taraftan gelen düşmanlar ateş etmeden önce onları fare tıklamasıyla vurmaya çalışırsın.
